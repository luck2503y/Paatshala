<svg viewBox="0 0 120 120" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Wakanda Night Violet Gradient -->
    <linearGradient id="bp-bg" x1="0" y1="0" x2="120" y2="120" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0a0518"/>
      <stop offset="50%" stop-color="#150d2a"/>
      <stop offset="100%" stop-color="#22113e"/>
    </linearGradient>

    <!-- Vibranium Silver Gradient -->
    <linearGradient id="bp-silver" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="50%" stop-color="#e2e8f0"/>
      <stop offset="100%" stop-color="#94a3b8"/>
    </linearGradient>

    <!-- Vibranium Purple Energy Glow -->
    <linearGradient id="bp-purple" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#c084fc"/>
      <stop offset="100%" stop-color="#7e22ce"/>
    </linearGradient>

    <!-- Suit Texture / Shading Gradients -->
    <linearGradient id="bp-suit" x1="60" y1="15" x2="60" y2="115" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#1f1b2e"/>
      <stop offset="40%" stop-color="#141120"/>
      <stop offset="100%" stop-color="#09070f"/>
    </linearGradient>

    <linearGradient id="bp-mask" x1="30" y1="20" x2="90" y2="90" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#241e38"/>
      <stop offset="35%" stop-color="#161324"/>
      <stop offset="80%" stop-color="#0d0b17"/>
      <stop offset="100%" stop-color="#05040a"/>
    </linearGradient>

    <!-- Eye Visor Glow -->
    <filter id="bp-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1.5" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Outer Circular Badge Frame -->
  <circle cx="60" cy="60" r="58" fill="url(#bp-bg)" stroke="#9333ea" stroke-width="2" stroke-opacity="0.45"/>
  <circle cx="60" cy="60" r="56.5" stroke="url(#bp-silver)" stroke-width="0.8" stroke-opacity="0.35"/>

  <!-- Subtle Vibranium Energy Hex Pattern in BG -->
  <path d="M60 8 L65 11 L65 17 L60 20 L55 17 L55 11 Z" stroke="#a855f7" stroke-width="0.75" opacity="0.3" fill="none"/>
  <path d="M22 45 L26 47 L26 52 L22 54 L18 52 L18 47 Z" stroke="#a855f7" stroke-width="0.75" opacity="0.2" fill="none"/>
  <path d="M98 45 L102 47 L102 52 L98 54 L94 52 L94 47 Z" stroke="#a855f7" stroke-width="0.75" opacity="0.2" fill="none"/>

  <!-- Shoulders & Upper Chest -->
  <path d="M12 118 C14 96 32 86 46 84 L74 84 C88 86 106 96 108 118 Z" fill="url(#bp-suit)"/>
  <path d="M12 118 C14 96 32 86 46 84 L74 84 C88 86 106 96 108 118 Z" stroke="#2e2547" stroke-width="1.2"/>

  <!-- Vibranium Collar / Chest Seams -->
  <path d="M46 84 L60 97 L74 84" stroke="url(#bp-purple)" stroke-width="1.8" stroke-linecap="round" fill="none"/>
  <path d="M38 91 L60 108 L82 91" stroke="#3b3254" stroke-width="1.4" stroke-linecap="round" fill="none"/>

  <!-- Vibranium Tooth / Claw Necklace on Chest -->
  <!-- Center Fang -->
  <polygon points="60,111 58,98 62,98" fill="url(#bp-silver)"/>
  <!-- Inner Flanking Fangs -->
  <polygon points="53,107 51,96 55,95" fill="url(#bp-silver)"/>
  <polygon points="67,107 65,95 69,96" fill="url(#bp-silver)"/>
  <!-- Middle Fangs -->
  <polygon points="46,102 44,92 48,91" fill="url(#bp-silver)"/>
  <polygon points="74,102 72,91 76,92" fill="url(#bp-silver)"/>
  <!-- Outer Fangs -->
  <polygon points="39,96 38,88 42,87" fill="url(#bp-silver)"/>
  <polygon points="81,96 78,87 82,88" fill="url(#bp-silver)"/>
  <!-- Far Outer Fangs -->
  <polygon points="32,90 32,83 36,83" fill="url(#bp-silver)"/>
  <polygon points="88,90 84,83 88,83" fill="url(#bp-silver)"/>

  <!-- Panther Ears (Behind / Part of Helmet) -->
  <!-- Left Ear -->
  <path d="M36 42 L32 20 C32 18 34 16 36 17 L47 26 Z" fill="#120e20" stroke="#382e56" stroke-width="1.5"/>
  <path d="M35 24 L38 22 L44 27" stroke="url(#bp-silver)" stroke-width="1.2" stroke-linecap="round" fill="none"/>
  <polygon points="36,23 39,28 35,27" fill="url(#bp-purple)" opacity="0.6"/>

  <!-- Right Ear -->
  <path d="M84 42 L88 20 C88 18 86 16 84 17 L73 26 Z" fill="#120e20" stroke="#382e56" stroke-width="1.5"/>
  <path d="M85 24 L82 22 L76 27" stroke="url(#bp-silver)" stroke-width="1.2" stroke-linecap="round" fill="none"/>
  <polygon points="84,23 81,28 85,27" fill="url(#bp-purple)" opacity="0.6"/>

  <!-- Head / Helmet Silhouette -->
  <path d="M47 26 C53 23 67 23 73 26 C82 30 87 40 86 54 C85 68 76 80 68 85 L60 88 L52 85 C44 80 35 68 34 54 C33 40 38 30 47 26 Z" fill="url(#bp-mask)" stroke="#2b2342" stroke-width="1.8"/>

  <!-- Helmet Centerline & Temporal Facets -->
  <path d="M60 24 L60 52" stroke="#251f38" stroke-width="2.5" stroke-linecap="round"/>
  
  <!-- Forehead Center Vibranium Sigil (Signature Wakandan Arrowhead/Crest) -->
  <polygon points="60,26 63,35 60,39 57,35" fill="url(#bp-silver)"/>
  <path d="M57 37 L51 43 M63 37 L69 43" stroke="url(#bp-silver)" stroke-width="1.4" stroke-linecap="round"/>
  <polygon points="60,41 62,47 60,50 58,47" fill="url(#bp-purple)"/>

  <!-- Brow Ridges -->
  <path d="M41 45 C46 43 53 44 57 47" stroke="url(#bp-silver)" stroke-width="1.6" stroke-linecap="round" fill="none"/>
  <path d="M79 45 C74 43 67 44 63 47" stroke="url(#bp-silver)" stroke-width="1.6" stroke-linecap="round" fill="none"/>

  <!-- Outer Brow Curves -->
  <path d="M38 41 C42 37 49 35 56 37" stroke="#3c3158" stroke-width="1.4" stroke-linecap="round" fill="none"/>
  <path d="M82 41 C78 37 71 35 64 37" stroke="#3c3158" stroke-width="1.4" stroke-linecap="round" fill="none"/>

  <!-- Slanted Feline Eyes / Lenses (Signature Black Panther Silver-White Visor) -->
  <!-- Left Eye -->
  <g filter="url(#bp-glow)">
    <polygon points="41,52 54,54 50,60 40,56" fill="#f8fafc" stroke="#cbd5e1" stroke-width="0.8"/>
    <!-- Subtle Inner Purple Energy Line -->
    <line x1="42" y1="54" x2="52" y2="55.5" stroke="#a855f7" stroke-width="0.75" stroke-linecap="round"/>
  </g>

  <!-- Right Eye -->
  <g filter="url(#bp-glow)">
    <polygon points="79,52 66,54 70,60 80,56" fill="#f8fafc" stroke="#cbd5e1" stroke-width="0.8"/>
    <!-- Subtle Inner Purple Energy Line -->
    <line x1="78" y1="54" x2="68" y2="55.5" stroke="#a855f7" stroke-width="0.75" stroke-linecap="round"/>
  </g>

  <!-- Eye Frame Outlines -->
  <polygon points="41,52 54,54 50,60 40,56" stroke="#4c1d95" stroke-width="1.2" fill="none"/>
  <polygon points="79,52 66,54 70,60 80,56" stroke="#4c1d95" stroke-width="1.2" fill="none"/>

  <!-- Nose Bridge & Muzzle Contours -->
  <path d="M57 48 L56 61 L58 64 L60 65 L62 64 L64 61 L63 48" fill="#110d1c" stroke="#251f38" stroke-width="1.2"/>
  
  <!-- Vibranium Nose Tip Plaque -->
  <polygon points="60,65 57,62 60,60 63,62" fill="url(#bp-silver)"/>

  <!-- Feline Whisker / Cheekbone Accent Stripes (Wakandan Tribal Engravings) -->
  <!-- Left Cheek Lines -->
  <path d="M38 58 L46 60 M37 64 L46 65 M38 70 L48 70" stroke="url(#bp-silver)" stroke-width="1.4" stroke-linecap="round"/>
  <path d="M42 55 L47 52" stroke="#4c3d6e" stroke-width="1.2" stroke-linecap="round"/>

  <!-- Right Cheek Lines -->
  <path d="M82 58 L74 60 M83 64 L74 65 M82 70 L72 70" stroke="url(#bp-silver)" stroke-width="1.4" stroke-linecap="round"/>
  <path d="M78 55 L73 52" stroke="#4c3d6e" stroke-width="1.2" stroke-linecap="round"/>

  <!-- Mouth & Jawline Detailing -->
  <!-- Muzzle curve -->
  <path d="M52 68 C56 71 60 71 60 71 C60 71 64 71 68 68" stroke="#332a4a" stroke-width="1.4" stroke-linecap="round" fill="none"/>
  <!-- Chin Line & Teeth Facets -->
  <path d="M53 74 L60 78 L67 74" stroke="url(#bp-silver)" stroke-width="1.6" stroke-linecap="round" fill="none"/>
  <path d="M56 81 L60 83 L64 81" stroke="url(#bp-purple)" stroke-width="1.5" stroke-linecap="round" fill="none"/>
  <polygon points="60,86 58,82 62,82" fill="url(#bp-silver)"/>

  <!-- Jaw Contour Accents -->
  <path d="M44 75 L49 82 L55 86" stroke="#2b2342" stroke-width="1.5" stroke-linecap="round" fill="none"/>
  <path d="M76 75 L71 82 L65 86" stroke="#2b2342" stroke-width="1.5" stroke-linecap="round" fill="none"/>
</svg>
