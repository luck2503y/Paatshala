<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">
  <title>Paatshala - Chat Room</title>
  <link rel="icon" type="image/png" href="paatshala-logo.png">
  
  <!-- Chat Protection & Anti-Direct Access Guard -->
  <script>
    (function () {
      const urlParams = new URLSearchParams(window.location.search);
      const authParam = urlParams.get('auth');
      const storedTicket = sessionStorage.getItem('paatshala_chat_authorized_ticket');
      const storedAuth = sessionStorage.getItem('paatshala_chat_authenticated');

      const isAuthorized = (authParam && storedTicket && authParam === storedTicket) || (storedAuth === 'true');

      if (!isAuthorized) {
        // Chat page must ONLY be accessible through the floating D / A icon + password.
        sessionStorage.removeItem('paatshala_chat_authorized_ticket');
        sessionStorage.removeItem('paatshala_chat_authenticated');
        sessionStorage.removeItem('paatshala_chat_user');
        window.location.replace('home.html');
        return;
      }

      // Capture participant user ('A' or 'D')
      const userParam = urlParams.get('user');
      if (userParam === 'A' || userParam === 'D') {
        sessionStorage.setItem('paatshala_chat_user', userParam);
      }

      // Capture source book parameters if coming from reader
      const fromBook = urlParams.get('fromBook');
      const fromCh = urlParams.get('ch');
      const fromScroll = urlParams.get('scroll');
      if (fromBook) {
        sessionStorage.setItem('paatshala_chat_source_book', JSON.stringify({
          bookId: fromBook,
          chapterIndex: parseInt(fromCh, 10) || 0,
          scrollY: parseInt(fromScroll, 10) || 0
        }));
      }

      // Consume one-time ticket
      sessionStorage.removeItem('paatshala_chat_authorized_ticket');

      const activeUser = userParam || sessionStorage.getItem('paatshala_chat_user') || 'A';
      sessionStorage.setItem('paatshala_chat_user', activeUser);

      // Clean query parameter while preserving user identity
      if (window.history && window.history.replaceState) {
        window.history.replaceState({ page: 'chat', user: activeUser }, document.title, 'chat.html?user=' + activeUser);
      }
    })();
  </script>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="chat.css">
</head>
<body data-theme="light">

  <div class="chat-room-container">

    <!-- Chat Top App Bar -->
    <header class="chat-room-header">
      <div class="header-left">
        <!-- Back Button to Home / Library -->
        <button type="button" class="chat-back-btn" id="chatBackBtn" aria-label="Back to Paatshala Home" title="Back to Home">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
            <line x1="19" y1="12" x2="5" y2="12"></line>
            <polyline points="12 19 5 12 12 5"></polyline>
          </svg>
        </button>

        <!-- Current Active Contact Profile -->
        <div class="active-contact-profile" id="activeContactBtn">
          <div class="contact-avatar-wrap">
            <img src="" alt="Contact Avatar" class="contact-avatar" id="activeContactAvatar">
            <span class="active-online-dot" id="activeOnlineDot"></span>
          </div>
          <div class="contact-info-col">
            <h2 class="active-contact-name" id="activeContactName">D</h2>
            <p class="active-contact-status" id="activeStatusText" style="display:block;">Online</p>
          </div>
        </div>
      </div>

      <div class="header-right">
        <!-- Theme Toggle -->
        <button class="header-tool-btn" id="themeToggleBtn" title="Toggle Theme" aria-label="Toggle theme">
          <svg class="header-icon sun-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <circle cx="12" cy="12" r="5"></circle>
            <line x1="12" y1="1" x2="12" y2="3"></line>
            <line x1="12" y1="21" x2="12" y2="23"></line>
            <line x1="4.22" y1="4.22" x2="5.64" y2="5.64"></line>
            <line x1="18.36" y1="18.36" x2="19.78" y2="19.78"></line>
            <line x1="1" y1="12" x2="3" y2="12"></line>
            <line x1="21" y1="12" x2="23" y2="12"></line>
            <line x1="4.22" y1="19.78" x2="5.64" y2="18.36"></line>
            <line x1="18.36" y1="5.64" x2="19.78" y2="4.22"></line>
          </svg>
          <svg class="header-icon moon-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path>
          </svg>
        </button>

        <!-- More Options Menu (Clear Chat, etc.) -->
        <div class="chat-menu-container">
          <button class="header-tool-btn" id="chatMenuBtn" title="More Options" aria-label="More options">
            <svg viewBox="0 0 24 24" fill="currentColor">
              <circle cx="12" cy="5" r="2"></circle>
              <circle cx="12" cy="12" r="2"></circle>
              <circle cx="12" cy="19" r="2"></circle>
            </svg>
          </button>
          <!-- Options Dropdown Menu -->
          <div class="chat-options-dropdown" id="chatOptionsDropdown">
            <button type="button" class="chat-dropdown-item danger" id="clearChatBtn">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <polyline points="3 6 5 6 21 6"></polyline>
                <path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path>
                <line x1="10" y1="11" x2="10" y2="17"></line>
                <line x1="14" y1="11" x2="14" y2="17"></line>
              </svg>
              <span>Clear Chat</span>
            </button>
          </div>
        </div>
      </div>
    </header>

    <!-- Switch Friends Drawer / Modal -->
    <div class="contacts-drawer-backdrop" id="contactsDrawerBackdrop">
      <div class="contacts-drawer">
        <div class="drawer-header">
          <h3 class="drawer-title">Classroom Chats</h3>
          <button type="button" class="drawer-close-btn" id="drawerCloseBtn" aria-label="Close contacts list">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
              <line x1="18" y1="6" x2="6" y2="18"></line>
              <line x1="6" y1="6" x2="18" y2="18"></line>
            </svg>
          </button>
        </div>
        <div class="drawer-contacts-list" id="drawerContactsList">
          <!-- Rendered dynamically via JS -->
        </div>
        <div class="drawer-footer-actions">
          <button type="button" class="drawer-clear-btn" id="drawerClearChatBtn">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <polyline points="3 6 5 6 21 6"></polyline>
              <path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path>
            </svg>
            <span>Clear Current Chat</span>
          </button>
        </div>
      </div>
    </div>

    <!-- Active Messages Scrollable Thread -->
    <main class="chat-thread-container" id="chatThreadContainer">
      <div class="chat-date-pill" id="chatDatePill">
        <span>Today</span>
      </div>

      <!-- Empty Chat State (Shown when cleared) -->
      <div class="empty-chat-state" id="emptyChatState" style="display: none;">
        <div class="empty-chat-icon">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">
            <path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"></path>
          </svg>
        </div>
        <p class="empty-chat-title">Chat Cleared</p>
        <p class="empty-chat-desc">No messages yet. Send a message to start a fresh conversation!</p>
      </div>

      <!-- Messages Stream -->
      <div class="messages-stream" id="messagesStream">
        <!-- Injected via chat.js based on selected conversation -->
      </div>
    </main>

    <!-- Typing Status Bar (Invisible when idle) -->
    <div class="typing-status-bar" id="typingStatusBar" style="display: none;">
      <span class="typing-anim-dots">
        <span></span><span></span><span></span>
      </span>
      <span class="typing-status-text" id="typingStatusLabel">Aarav is typing...</span>
    </div>

    <!-- Fixed Bottom Message Input Bar -->
    <footer class="chat-input-bar">
      <!-- Image Attachment Preview Strip -->
      <div class="input-attachment-preview" id="inputAttachmentPreview" style="display: none;">
        <div class="attachment-thumb-wrap">
          <img id="attachmentThumbImg" src="" alt="Selected image">
          <button type="button" class="attachment-remove-btn" id="attachmentRemoveBtn" aria-label="Remove image" title="Remove image">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
              <line x1="18" y1="6" x2="6" y2="18"></line>
              <line x1="6" y1="6" x2="18" y2="18"></line>
            </svg>
          </button>
        </div>
        <div class="attachment-info-col">
          <span class="attachment-name" id="attachmentFileName">image.jpg</span>
          <span class="attachment-hint">Ready to send with message</span>
        </div>
      </div>

      <form class="chat-input-form" id="chatMessageForm">
        
        <!-- Emoji Picker Button -->
        <button type="button" class="input-tool-btn" id="emojiPickerBtn" title="Insert Emoji" aria-label="Insert emoji">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <circle cx="12" cy="12" r="10"></circle>
            <path d="M8 14s1.5 2 4 2 4-2 4-2"></path>
            <line x1="9" y1="9" x2="9.01" y2="9"></line>
            <line x1="15" y1="9" x2="15.01" y2="9"></line>
          </svg>
        </button>

        <!-- Image Attachment Button -->
        <button type="button" class="input-tool-btn" id="attachImageBtn" title="Attach Image" aria-label="Attach image from gallery or files">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M21.44 11.05l-9.19 9.19a6 6 0 0 1-8.49-8.49l9.19-9.19a4 4 0 0 1 5.66 5.66l-9.2 9.19a2 2 0 0 1-2.83-2.83l8.49-8.48"></path>
          </svg>
        </button>
        <!-- Hidden Image File Input -->
        <input type="file" id="imageFileInput" accept="image/*" style="display: none;">

        <!-- Message Input Field -->
        <div class="message-field-wrap">
          <input 
            type="text" 
            id="messageTextInput" 
            class="message-text-input" 
            placeholder="Type your message..." 
            autocomplete="off"
            maxlength="1000"
          >
        </div>

        <!-- Send Button -->
        <button type="submit" class="send-message-btn" id="sendMessageBtn" aria-label="Send message">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round">
            <line x1="22" y1="2" x2="11" y2="13"></line>
            <polygon points="22 2 15 22 11 13 2 9 22 2"></polygon>
          </svg>
        </button>

      </form>
    </footer>

    <!-- Interactive Emoji Picker Popover -->
    <div class="emoji-picker-popover" id="emojiPickerPopover">
      <div class="emoji-picker-header">
        <div class="emoji-search-wrap">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <circle cx="11" cy="11" r="8"></circle>
            <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
          </svg>
          <input type="text" id="emojiSearchInput" class="emoji-search-input" placeholder="Search emojis...">
        </div>
      </div>
      <div class="emoji-category-tabs" id="emojiCategoryTabs">
        <button type="button" class="emoji-tab-btn active" data-category="smileys" title="Smileys">😀</button>
        <button type="button" class="emoji-tab-btn" data-category="gestures" title="Hands & People">👍</button>
        <button type="button" class="emoji-tab-btn" data-category="study" title="Study & Education">📚</button>
        <button type="button" class="emoji-tab-btn" data-category="nature" title="Nature & India">🦅</button>
        <button type="button" class="emoji-tab-btn" data-category="symbols" title="Hearts & Symbols">❤️</button>
      </div>
      <div class="emoji-grid-container" id="emojiGridContainer">
        <!-- Injected dynamically via JS -->
      </div>
    </div>

    <!-- Fullscreen Image Lightbox Modal -->
    <div class="image-modal-backdrop" id="imageModalBackdrop" style="display: none;">
      <div class="image-modal-top-bar">
        <a id="imageModalDownload" class="image-modal-action-btn" download="paatshala_image.png" title="Download / Save Image" aria-label="Download image">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" width="18" height="18">
            <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path>
            <polyline points="7 10 12 15 17 10"></polyline>
            <line x1="12" y1="15" x2="12" y2="3"></line>
          </svg>
          <span>Save Image</span>
        </a>
        <button type="button" class="image-modal-close" id="imageModalClose" aria-label="Close image viewer" title="Close">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
            <line x1="18" y1="6" x2="6" y2="18"></line>
            <line x1="6" y1="6" x2="18" y2="18"></line>
          </svg>
        </button>
      </div>
      <div class="image-modal-content">
        <img id="imageModalTarget" src="" alt="Full size image">
      </div>
    </div>

    <!-- Long-Press Message Action Menu / Bottom Sheet -->
    <div class="msg-action-backdrop" id="msgActionBackdrop" style="display: none;">
      <div class="msg-action-sheet" id="msgActionSheet">
        <div class="msg-action-handle" aria-hidden="true"></div>
        <div class="msg-action-header">
          <span class="msg-action-title">Message Options</span>
          <span class="msg-action-preview" id="msgActionPreviewText">Message preview...</span>
        </div>
        <div class="msg-action-buttons">
          <!-- 1. Edit Message -->
          <button type="button" class="msg-action-btn" id="msgActionEditBtn">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"></path>
              <path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"></path>
            </svg>
            <span>Edit Message</span>
          </button>

          <!-- 2. Delete (For Me) -->
          <button type="button" class="msg-action-btn danger" id="msgActionDeleteForMeBtn">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <polyline points="3 6 5 6 21 6"></polyline>
              <path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path>
            </svg>
            <span>Delete</span>
          </button>

          <!-- 3. Delete for Everyone -->
          <button type="button" class="msg-action-btn danger-intense" id="msgActionDeleteForEveryoneBtn">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"></path>
              <circle cx="9" cy="7" r="4"></circle>
              <line x1="17" y1="8" x2="23" y2="14"></line>
              <line x1="23" y1="8" x2="17" y2="14"></line>
            </svg>
            <span>Delete for Everyone</span>
          </button>
        </div>
        <button type="button" class="msg-action-cancel-btn" id="msgActionCancelBtn">Cancel</button>
      </div>
    </div>

    <!-- Edit Message Modal -->
    <div class="edit-msg-modal-backdrop" id="editMsgModalBackdrop" style="display: none;">
      <div class="edit-msg-modal-card">
        <div class="edit-msg-modal-header">
          <div class="edit-msg-modal-icon">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"></path>
              <path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"></path>
            </svg>
          </div>
          <h3 class="edit-msg-modal-title">Edit Message</h3>
          <button type="button" class="edit-msg-modal-close" id="editMsgModalClose" aria-label="Cancel editing">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
              <line x1="18" y1="6" x2="6" y2="18"></line>
              <line x1="6" y1="6" x2="18" y2="18"></line>
            </svg>
          </button>
        </div>
        <form class="edit-msg-form" id="editMsgForm">
          <textarea id="editMsgInput" class="edit-msg-textarea" rows="3" placeholder="Edit your message..." required></textarea>
          <div class="edit-msg-actions">
            <button type="button" class="edit-msg-btn cancel" id="editMsgCancelBtn">Cancel</button>
            <button type="submit" class="edit-msg-btn save" id="editMsgSaveBtn">Save Changes</button>
          </div>
        </form>
      </div>
    </div>

  </div>

  <script src="chat.js"></script>
</body>
</html>
