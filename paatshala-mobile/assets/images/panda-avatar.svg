  <ellipse cx="60" cy="74.5" rx="2" ry="1" fill="#FFFFFF" opacity="0.6"/>
  
  <!-- Cute Smile Mouth -->
  <path d="M54 82 Q60 88 66 82" stroke="#1E293B" stroke-width="2.5" stroke-linecap="round" fill="none"/>
  
  <!-- Tiny Bamboo Leaf Decoration on Head -->
  <path d="M60 22 C64 16 72 17 74 21 C70 24 64 24 60 22 Z" fill="#10B981"/>
