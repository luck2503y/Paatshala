<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Paatshala - Login</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body data-theme="light">

  <!-- Desktop Controls Bar (for previewing responsive modes & dark theme) -->
  <header class="preview-toolbar" id="previewToolbar">
    <div class="toolbar-brand">
      <span class="preview-badge">Mobile Chat UI</span>
      <span class="preview-title">Paatshala</span>
    </div>
    <div class="toolbar-actions">
      <button class="tool-btn" id="viewToggleBtn" title="Toggle Phone Frame / Responsive View" aria-label="Toggle frame view">
        <svg class="tool-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <rect x="5" y="2" width="14" height="20" rx="3" ry="3"></rect>
          <line x1="12" y1="18" x2="12.01" y2="18"></line>
        </svg>
        <span class="btn-text">Frame Mode</span>
      </button>

      <button class="tool-btn" id="themeToggleBtn" title="Toggle Dark/Light Mode" aria-label="Toggle theme">
        <svg class="tool-icon sun-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <circle cx="12" cy="12" r="5"></circle>
          <line x1="12" y1="1" x2="12" y2="3"></line>
          <line x1="12" y1="21" x2="12" y2="23"></line>
          <line x1="4.22" y1="4.22" x2="5.64" y2="5.64"></line>
          <line x1="18.36" y1="18.36" x2="19.78" y2="19.78"></line>
          <line x1="1" y1="12" x2="3" y2="12"></line>
          <line x1="21" y1="12" x2="23" y2="12"></line>
          <line x1="4.22" y1="19.78" x2="5.64" y2="18.36"></line>
          <line x1="18.36" y1="5.64" x2="19.78" y2="4.22"></line>
        </svg>
        <svg class="tool-icon moon-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path>
        </svg>
        <span class="btn-text" id="themeText">Dark</span>
      </button>
    </div>
  </header>

  <!-- Main Viewport Container -->
  <main class="app-viewport">
    
    <!-- Phone Mockup Frame (Adapts fluidly on native mobile screens) -->
    <div class="mobile-frame" id="mobileFrame">
      
      <!-- Ambient Backlight -->
      <div class="ambient-glow" aria-hidden="true"></div>

      <!-- Mobile Status Bar (Simulated Mobile Chrome) -->
      <div class="status-bar" aria-hidden="true">
        <span class="status-time" id="currentTime">09:41</span>
        <div class="dynamic-island">
          <span class="camera-lens"></span>
        </div>
        <div class="status-icons">
          <!-- Cellular Signal -->
          <svg viewBox="0 0 24 24" fill="currentColor" class="status-icon">
            <path d="M2 17h3v4H2v-4zm6-5h3v9H8v-9zm6-4h3v13h-3V8zm6-5h3v18h-3V3z"/>
          </svg>
          <!-- Wi-Fi -->
          <svg viewBox="0 0 24 24" fill="currentColor" class="status-icon">
            <path d="M12 4c-4.2 0-8 1.6-11 4.3l1.8 2.2C5.3 8.3 8.5 7 12 7s6.7 1.3 9.2 3.5L23 8.3C20 5.6 16.2 4 12 4zm0 6c-2.6 0-5 1-6.9 2.7l1.8 2.2C8.3 13.7 10.1 13 12 13s3.7.7 5.1 1.9l1.8-2.2C17 11 14.6 10 12 10zm0 6c-1.1 0-2.1.4-2.8 1.1L12 20.2l2.8-3.1c-.7-.7-1.7-1.1-2.8-1.1z"/>
          </svg>
          <!-- Battery -->
          <svg viewBox="0 0 24 24" fill="currentColor" class="status-icon">
            <path d="M17 6H4c-1.1 0-2 .9-2 2v8c0 1.1.9 2 2 2h13c1.1 0 2-.9 2-2V8c0-1.1-.9-2-2-2zm-1 9H5V9h11v6zm4-7v6c.6 0 1-.4 1-1V9c0-.6-.4-1-1-1z"/>
          </svg>
        </div>
      </div>

      <!-- Scrollable Mobile Screen Content -->
      <div class="screen-content">
        
        <!-- Header Branding & Welcome -->
        <section class="branding-section">
          <!-- App Logo -->
          <div class="logo-wrapper">
            <div class="logo-halo" aria-hidden="true"></div>
            <div class="logo-mark">
              <!-- Modern Chat + Graduation/Spark Fusion SVG -->
              <svg viewBox="0 0 48 48" fill="none" class="brand-svg" xmlns="http://www.w3.org/2000/svg">
                <rect width="48" height="48" rx="16" fill="url(#logo-grad)"/>
                <path d="M14 23.5C14 17.7 18.5 13 24 13C29.5 13 34 17.7 34 23.5C34 29.3 29.5 34 24 34C22.2 34 20.5 33.5 19 32.6L14 34.5L15.6 30C14.6 28.1 14 25.9 14 23.5Z" fill="white" fill-opacity="0.95"/>
                <circle cx="20" cy="23.5" r="2" fill="#4F46E5"/>
                <circle cx="24" cy="23.5" r="2" fill="#4F46E5"/>
                <circle cx="28" cy="23.5" r="2" fill="#4F46E5"/>
                <defs>
                  <linearGradient id="logo-grad" x1="0" y1="0" x2="48" y2="48" gradientUnits="userSpaceOnUse">
                    <stop stop-color="#4F46E5"/>
                    <stop offset="1" stop-color="#7C3AED"/>
                  </linearGradient>
                </defs>
              </svg>
            </div>
          </div>

          <!-- App Name -->
          <h1 class="app-title">Paatshala</h1>
        </section>

        <!-- Login Form Card -->
        <section class="auth-card" aria-label="Login Form">
          <div class="auth-header">
            <h2 class="auth-heading">Login</h2>
            <p class="auth-subtitle">Welcome back! Please enter your details to access your chats.</p>
          </div>

          <form id="loginForm" class="login-form" novalidate>
            
            <!-- Username Input Field -->
            <div class="form-group" id="usernameGroup">
              <label for="username" class="form-label">Username</label>
              <div class="input-container">
                <span class="input-icon" aria-hidden="true">
                  <!-- User Profile SVG -->
                  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path>
                    <circle cx="12" cy="7" r="4"></circle>
                  </svg>
                </span>
                <input 
                  type="text" 
                  id="username" 
                  name="username" 
                  class="form-input" 
                  placeholder="Enter your username" 
                  autocomplete="username" 
                  required
                >
              </div>
              <span class="input-feedback" id="usernameFeedback"></span>
            </div>

            <!-- Password Input Field -->
            <div class="form-group" id="passwordGroup">
              <div class="label-row">
                <label for="password" class="form-label">Password</label>
                <a href="#forgot" class="forgot-link" tabindex="0">Forgot?</a>
              </div>
              <div class="input-container">
                <span class="input-icon" aria-hidden="true">
                  <!-- Lock SVG -->
                  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect>
                    <path d="M7 11V7a5 5 0 0 1 10 0v4"></path>
                  </svg>
                </span>
                <input 
                  type="password" 
                  id="password" 
                  name="password" 
                  class="form-input" 
                  placeholder="Enter your password" 
                  autocomplete="current-password" 
                  required
                >
                <!-- Toggle Password Visibility Button -->
                <button 
                  type="button" 
                  class="password-toggle-btn" 
                  id="passwordToggleBtn" 
                  aria-label="Show password"
                >
                  <!-- Eye Open SVG -->
                  <svg class="eye-icon eye-open" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
                    <circle cx="12" cy="12" r="3"></circle>
                  </svg>
                  <!-- Eye Closed SVG -->
                  <svg class="eye-icon eye-closed" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"></path>
                    <line x1="1" y1="1" x2="23" y2="23"></line>
                  </svg>
                </button>
              </div>
              <span class="input-feedback" id="passwordFeedback"></span>
            </div>

            <!-- Remember me row -->
            <div class="form-auxiliary">
              <label class="remember-control">
                <input type="checkbox" id="rememberMe" class="custom-checkbox">
                <span class="checkbox-indicator">
                  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
                    <polyline points="20 6 9 17 4 12"></polyline>
                  </svg>
                </span>
                <span class="remember-text">Remember me</span>
              </label>
            </div>

            <!-- Login Action Button -->
            <button type="submit" class="login-btn" id="loginBtn">
              <span class="btn-spinner" aria-hidden="true"></span>
              <span class="btn-text">Login</span>
              <span class="btn-icon" aria-hidden="true">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                  <line x1="5" y1="12" x2="19" y2="12"></line>
                  <polyline points="12 5 19 12 12 19"></polyline>
                </svg>
              </span>
            </button>

          </form>

        </section>

        <!-- Simulated In-App Notification / Toast -->
        <div class="toast-notification" id="toastNotification" role="alert" aria-live="assertive">
          <div class="toast-icon">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"></path>
              <polyline points="22 4 12 14.01 9 11.01"></polyline>
            </svg>
          </div>
          <div class="toast-body">
            <p class="toast-title">Frontend Prototype Demo</p>
            <p class="toast-desc" id="toastMessage">Login clicked. Ready for backend integration.</p>
          </div>
        </div>

      </div>

      <!-- Simulated Home Bar for Mobile View -->
      <div class="home-indicator-bar" aria-hidden="true">
        <div class="home-indicator"></div>
      </div>

    </div>

  </main>

  <script src="script.js"></script>
</body>
</html>
