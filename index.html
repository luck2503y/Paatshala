<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Paatshala - Login</title>
  <link rel="icon" type="image/png" href="paatshala-logo.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="d-chat.css">
</head>
<body data-theme="light">

  <!-- Background Ambient Glow Effects -->
  <div class="ambient-glow glow-top-right" aria-hidden="true"></div>
  <div class="ambient-glow glow-bottom-left" aria-hidden="true"></div>

  <!-- Standard Web Navigation Bar -->
  <header class="site-navbar">
    <div class="navbar-container">
      <a href="/" class="brand-link" aria-label="Paatshala Home">
        <div class="brand-logo-small">
          <img src="paatshala-logo.png" alt="Paatshala Logo" class="brand-logo-img">
        </div>
        <span class="brand-text">Paatshala</span>
      </a>

      <div class="navbar-actions">
        <button class="theme-toggle-btn" id="themeToggleBtn" title="Toggle Dark/Light Mode" aria-label="Toggle theme">
          <svg class="theme-icon sun-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <circle cx="12" cy="12" r="5"></circle>
            <line x1="12" y1="1" x2="12" y2="3"></line>
            <line x1="12" y1="21" x2="12" y2="23"></line>
            <line x1="4.22" y1="4.22" x2="5.64" y2="5.64"></line>
            <line x1="18.36" y1="18.36" x2="19.78" y2="19.78"></line>
            <line x1="1" y1="12" x2="3" y2="12"></line>
            <line x1="21" y1="12" x2="23" y2="12"></line>
            <line x1="4.22" y1="19.78" x2="5.64" y2="18.36"></line>
            <line x1="18.36" y1="5.64" x2="19.78" y2="4.22"></line>
          </svg>
          <svg class="theme-icon moon-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path>
          </svg>
          <span class="theme-btn-text" id="themeText">Dark</span>
        </button>
      </div>
    </div>
  </header>

  <!-- Main Responsive Center Content -->
  <main class="page-container">
    <div class="login-wrapper">

      <!-- Login Card Container -->
      <div class="auth-card">

        <!-- Branding Section -->
        <div class="branding-header">
          <div class="logo-wrapper">
            <div class="logo-halo" aria-hidden="true"></div>
            <div class="logo-mark">
              <img src="paatshala-logo.png" alt="Paatshala Logo" class="brand-logo-img">
            </div>
          </div>
          <h1 class="app-title">Paatshala</h1>
        </div>

        <!-- Heading -->
        <div class="auth-heading-row">
          <h2 class="auth-heading">Login</h2>
        </div>

        <!-- Form -->
        <form id="loginForm" class="login-form" novalidate>
          
          <!-- Username Input Field -->
          <div class="form-group" id="usernameGroup">
            <label for="username" class="form-label">Username</label>
            <div class="input-container">
              <span class="input-icon" aria-hidden="true">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                  <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path>
                  <circle cx="12" cy="7" r="4"></circle>
                </svg>
              </span>
              <input 
                type="text" 
                id="username" 
                name="username" 
                class="form-input" 
                placeholder="Enter your username" 
                autocomplete="username" 
                required
              >
            </div>
            <span class="input-feedback" id="usernameFeedback"></span>
          </div>

          <!-- Password Input Field -->
          <div class="form-group" id="passwordGroup">
            <div class="label-row">
              <label for="password" class="form-label">Password</label>
              <a href="#forgot" class="forgot-link" tabindex="0">Forgot?</a>
            </div>
            <div class="input-container">
              <span class="input-icon" aria-hidden="true">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                  <rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect>
                  <path d="M7 11V7a5 5 0 0 1 10 0v4"></path>
                </svg>
              </span>
              <input 
                type="password" 
                id="password" 
                name="password" 
                class="form-input" 
                placeholder="Enter your password" 
                autocomplete="current-password" 
                required
              >
              <!-- Toggle Password Visibility Button -->
              <button 
                type="button" 
                class="password-toggle-btn" 
                id="passwordToggleBtn" 
                aria-label="Show password"
              >
                <svg class="eye-icon eye-open" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                  <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
                  <circle cx="12" cy="12" r="3"></circle>
                </svg>
                <svg class="eye-icon eye-closed" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                  <path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"></path>
                  <line x1="1" y1="1" x2="23" y2="23"></line>
                </svg>
              </button>
            </div>
            <span class="input-feedback" id="passwordFeedback"></span>
          </div>

          <!-- Login Action Button -->
          <button type="submit" class="login-btn" id="loginBtn">
            <span class="btn-spinner" aria-hidden="true"></span>
            <span class="btn-text">Login</span>
            <span class="btn-icon" aria-hidden="true">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                <line x1="5" y1="12" x2="19" y2="12"></line>
                <polyline points="12 5 19 12 12 19"></polyline>
              </svg>
            </span>
          </button>

        </form>

      </div>

      <!-- In-App Notification / Toast Feedback -->
      <div class="toast-notification" id="toastNotification" role="alert" aria-live="assertive">
        <div class="toast-icon">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"></path>
            <polyline points="22 4 12 14.01 9 11.01"></polyline>
          </svg>
        </div>
        <div class="toast-body">
          <p class="toast-title">Frontend Prototype Demo</p>
          <p class="toast-desc" id="toastMessage">Login clicked. Ready for backend integration.</p>
        </div>
      </div>

    </div>
  </main>

  <!-- Floating Action Button "D" -->
  <button class="floating-d-btn" id="floatingDBtn" aria-label="Paatshala D Action" title="Paatshala">
    <span class="d-letter">D</span>
  </button>

  <script src="script.js"></script>
  <script src="d-chat.js"></script>
</body>
</html>
